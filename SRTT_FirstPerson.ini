; SRTT First Person settings. Changes take effect the next time the game starts.
[FirstPerson]
; Key that switches between first and third person: a letter/digit, or a virtual-key code such as 0x4C.
ToggleKey=L
; 1 = start the game in first person.
StartEnabled=0
; 1 = first person also while driving, flying, boating and aiming from a vehicle.
VehicleFirstPerson=1
; 0 = in first person the view turns with the vehicle and stays wherever you point it. 1 = keep the
; game's behaviour of swinging the view back to face forward (and locking it behind aircraft).
VehicleAutoCenter=0

; 1 = the camera follows your character's head, so it stays at the eyes while walking, running,
; crouching, leaning and sitting in vehicles. 0 = a fixed point above the feet (EyeHeight / CrouchEyeHeight).
AttachToHead=1
; Where the eyes are relative to the head, in metres: up, and forward in the direction you look.
HeadUp=0.08
HeadForward=0.10
; Smooths out head bob, in seconds (0 = off, larger = steadier but slightly laggy).
HeadSmoothing=0.08

; Camera height above the feet in metres when not following the head (scaled with the character's size).
EyeHeight=1.60
CrouchEyeHeight=1.30

; Field of view in first person (the game uses 50 on foot and in cars). 0 = keep the game's value.
FOV=82.8
SprintFOV=91.08
; Used while aiming (right mouse button).
AimFOV=55.2
VehicleFOV=82.8

; How far you can look up/down in first person, in degrees (on foot the game allows 75 up, 55 down).
; 0 = keep the game's limit.
LookUpLimit=80
LookDownLimit=80

; Near clip distance in first person, in metres (the game uses 0.15). Raise it if parts of your own
; head or hair show; too high a value clips your weapon.
NearClip=0.15

; Level-of-detail distance multiplier for characters, level objects, instanced meshes, vehicles and
; items (weapons etc.): 4 = detailed models are kept four times as far away. 1 = the game's own
; distances. Higher values cost frame rate.
LODScale=4

; Log to SRTT_FirstPerson.log in the game folder. Debug=1 also logs the camera state every second.
Log=1
Debug=0
